name: Publish portable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        shell: pwsh
        run: |
          dotnet test RouteAnalyzer.sln

      - name: Publish app
        shell: pwsh
        run: |
          ./scripts/publish-app.ps1 -Runtime win-x64 -Configuration Release

      - name: Package app
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "artifacts/RouteAnalyzer.App-win-x64.zip"
          if (Test-Path $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          Compress-Archive -Path "artifacts/app/win-x64/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteAnalyzer.App-win-x64
          path: artifacts/RouteAnalyzer.App-win-x64.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "artifacts/RouteAnalyzer.App-win-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip --title $tag --generate-notes
          }
          else {
            gh release upload $tag $zip --clobber
          }
